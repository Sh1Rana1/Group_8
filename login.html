<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoltDorm OS · 登录</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:"Microsoft YaHei","PingFang SC",sans-serif}.panel{animation:in .25s ease}@keyframes in{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}</style></head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4 relative overflow-x-hidden"><div class="fixed inset-0 pointer-events-none"><div class="absolute -top-40 -left-24 w-96 h-96 rounded-full bg-indigo-200 blur-3xl"></div><div class="absolute -bottom-44 -right-20 w-96 h-96 rounded-full bg-sky-100 blur-3xl"></div></div>
<main class="relative w-full max-w-5xl bg-white rounded-3xl shadow-2xl shadow-slate-300/60 overflow-hidden grid lg:grid-cols-2 min-h-[630px]"><section class="hidden lg:flex bg-gradient-to-br from-slate-950 via-indigo-950 to-indigo-800 text-white p-12 flex-col justify-between relative overflow-hidden"><div class="absolute -right-24 top-14 w-80 h-80 rounded-full border-[65px] border-white/5"></div><div class="relative"><div class="flex items-center gap-3"><div class="w-11 h-11 rounded-2xl bg-indigo-500 flex items-center justify-center text-xl shadow-lg">⚡</div><div><b class="text-xl">VoltDorm OS</b><p class="text-xs text-indigo-200">高校宿舍水电能源管理系统</p></div></div><div class="mt-20"><h1 class="text-4xl font-bold leading-tight">让校园水电管理<br>更智能、更透明</h1><p class="text-sm text-indigo-200 leading-7 mt-5 max-w-sm">统一连接 NB-IoT 电表与直饮水表，为学生提供便捷服务，为管理人员提供清晰、可靠的能源数据。</p></div></div><div class="relative grid grid-cols-3 gap-3 text-center"><div class="bg-white/10 border border-white/10 rounded-2xl p-4"><b class="block text-xl">1,590</b><span class="text-[10px] text-indigo-200">接入设备</span></div><div class="bg-white/10 border border-white/10 rounded-2xl p-4"><b class="block text-xl">99.1%</b><span class="text-[10px] text-indigo-200">在线率</span></div><div class="bg-white/10 border border-white/10 rounded-2xl p-4"><b class="block text-xl">24h</b><span class="text-[10px] text-indigo-200">实时监测</span></div></div></section>
<section class="p-7 sm:p-11 flex flex-col"><div class="lg:hidden flex items-center gap-2 mb-8"><span class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center">⚡</span><b>VoltDorm OS</b></div><div><h2 class="text-2xl font-bold text-slate-900">欢迎使用</h2><p class="text-sm text-slate-400 mt-2">请选择身份并登录校园水电账户</p></div><div class="grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-2xl mt-8"><button id="studentTab" onclick="setRole('student')" class="py-2.5 rounded-xl bg-white text-indigo-600 font-bold text-sm shadow-sm">学生登录</button><button id="adminTab" onclick="setRole('admin')" class="py-2.5 rounded-xl text-slate-500 text-sm">管理员登录</button></div>
<form id="loginForm" class="panel mt-7 space-y-5" onsubmit="login(event)"><div><label class="block text-xs font-semibold text-slate-600 mb-2">账号</label><input id="loginUsername" autocomplete="username" required placeholder="请输入账号" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400"></div><div><label class="block text-xs font-semibold text-slate-600 mb-2">密码</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="请输入密码" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400"></div><p id="adminHint" class="hidden text-xs bg-indigo-50 text-indigo-600 p-3 rounded-xl">管理员账号：admin　密码：123456</p><p id="loginError" class="hidden text-xs text-rose-600 bg-rose-50 p-3 rounded-xl"></p><button id="loginButton" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-lg shadow-indigo-100">登录</button><div id="registerLink" class="text-center text-xs text-slate-400">还没有学生账户？<button type="button" onclick="showRegister()" class="text-indigo-600 font-bold">立即注册</button></div></form>
<form id="registerForm" class="panel hidden mt-6 space-y-4" onsubmit="register(event)"><div class="flex justify-between items-center"><div><h3 class="font-bold">注册学生账户</h3><p class="text-[11px] text-slate-400 mt-1">请选择真实住宿信息</p></div><button type="button" onclick="showLogin()" class="text-xs text-indigo-600 font-bold">返回登录</button></div><div class="grid grid-cols-3 gap-2"><div><label class="block text-[11px] text-slate-500 mb-2">宿舍楼</label><select id="building" required class="w-full border border-slate-200 rounded-xl px-2 py-3 text-xs"></select></div><div><label class="block text-[11px] text-slate-500 mb-2">楼层</label><select id="floor" required class="w-full border border-slate-200 rounded-xl px-2 py-3 text-xs"></select></div><div><label class="block text-[11px] text-slate-500 mb-2">房间</label><select id="room" required class="w-full border border-slate-200 rounded-xl px-2 py-3 text-xs"></select></div></div><div><label class="block text-[11px] text-slate-500 mb-2">姓名</label><input id="regName" required minlength="2" placeholder="请输入真实姓名" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm"></div><div><label class="block text-[11px] text-slate-500 mb-2">登录账号</label><input id="regUsername" required minlength="3" autocomplete="username" placeholder="至少 3 位" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm"></div><div><label class="block text-[11px] text-slate-500 mb-2">登录密码</label><input id="regPassword" required minlength="6" type="password" autocomplete="new-password" placeholder="至少 6 位" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm"></div><p class="text-[10px] text-slate-400 bg-slate-50 p-3 rounded-xl">注册完成后，个人电费、用电量、饮水余额和用水量的初始数据均为 0。</p><p id="registerError" class="hidden text-xs text-rose-600 bg-rose-50 p-3 rounded-xl"></p><button class="w-full py-3 bg-indigo-600 text-white rounded-xl text-sm font-bold">提交注册</button></form></section></main>
<div id="toast" class="hidden fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl text-xs shadow-xl"></div>
<script src="./login.js"></script></body></html>
